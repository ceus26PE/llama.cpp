name: Compilar para Athlon II y T400

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Descargar el código desde MBZUAI
        uses: actions/checkout@v4
        with:
          repository: 'MBZUAI-IFM/llama.cpp'
          ref: 'model/K2Horizon'

      - name: Instalar CUDA 12.4 oficial
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.4.1'
          method: 'network'

      - name: Configurar CMake sin AVX, sin OpenSSL y con Turing 75
        run: |
          cmake -B build `
            -DGGML_CUDA=ON `
            -DCMAKE_CUDA_ARCHITECTURES="75" `
            -DGGML_NATIVE=OFF `
            -DGGML_AVX=OFF `
            -DGGML_AVX2=OFF `
            -DGGML_AVX512=OFF `
            -DGGML_FMA=OFF `
            -DGGML_CPU_ALL_VARIANTS=OFF `
            -DLLAMA_CURL=OFF `
            -DLLAMA_SSL=OFF

      - name: Compilar llama-server en Release
        run: |
          cmake --build build --config Release --target llama-server -j 4

      - name: Copiar DLLs de CUDA al paquete
        run: |
          copy "$env:CUDA_PATH\bin\cudart64_*.dll" build\bin\Release\
          copy "$env:CUDA_PATH\bin\cublas64_*.dll" build\bin\Release\
          copy "$env:CUDA_PATH\bin\cublasLt64_*.dll" build\bin\Release\

      - name: Empaquetar y subir el ejecutable completo
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-K2-Athlon-T400-Puro
          path: |
            build/bin/Release/llama-server.exe
            build/bin/Release/*.dll
